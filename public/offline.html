<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <title>You're offline — FitTrack AI</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101820;
        color: #f7faf8;
        font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 999px;
        background: rgba(24, 199, 138, 0.16);
        color: #18c78a;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        font-size: 24px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.9rem;
        color: #92a2af;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: #18c78a;
        color: #101820;
        border: none;
        border-radius: 999px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">⚡</div>
      <h1>You&rsquo;re offline</h1>
      <p>FitTrack AI needs a connection to load your data. Check your network and try again — anything you logged earlier is already saved.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
